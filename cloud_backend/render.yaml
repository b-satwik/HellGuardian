databases:
  - name: hellguardian-db
    plan: free

services:
  - type: web
    name: hellguardian-cloud-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r cloud_backend/requirements.txt"
    startCommand: "python3 -m uvicorn cloud_backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hellguardian-db
          property: connectionString
      - key: INGEST_API_KEY
        value: hg_sec_token_9f82d1a4e76c
      - key: OFFLINE_TIMEOUT_SECONDS
        value: 300
      - key: PYTHON_VERSION
        value: 3.12.0
