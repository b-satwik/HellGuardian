<!-- Sandbox Analyst Console View Module -->
<div class="detail-panel">
  <div class="panel-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; flex-wrap: wrap; gap: 10px;">
    <h3>Sandbox Malware Execution Traces</h3>
    <div style="display:flex; gap:10px; align-items: center; flex-wrap: wrap;">
      <input type="text" id="sandbox-search" placeholder="Search sandbox..." style="padding:4px 8px; border:1px solid var(--border-color); font-size:12px; border-radius: 4px;" />
      <button id="sandbox-export" class="action-btn" style="padding:4px 8px; font-size:12px;">Export CSV</button>
    </div>
  </div>
  
  <div class="table-responsive">
    <table class="data-table dense-table" id="sandbox-table">
      <thead>
        <tr>
          <th>Hash</th>
          <th>File name</th>
          <th>Status</th>
          <th>VT Score</th>
          <th>Malware family</th>
          <th>Process tree</th>
          <th>Network connections</th>
          <th>DNS</th>
          <th>Dropped files</th>
          <th>Mutex</th>
          <th>Registry</th>
          <th>Report</th>
        </tr>
      </thead>
      <tbody id="sandbox-tbody">
        <tr><td colspan="12" class="offline-msg">No malware sandbox execution tasks recorded.</td></tr>
      </tbody>
    </table>
  </div>
</div>
