<!-- Conpot Industrial Honeypot View Module -->
<div class="detail-panel">
  <div class="panel-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; flex-wrap: wrap; gap: 10px;">
    <h3>Conpot SCADA Modbus Register Observability</h3>
    <div style="display:flex; gap:10px; align-items: center; flex-wrap: wrap;">
      <input type="text" id="conpot-search" placeholder="Search events..." style="padding:4px 8px; border:1px solid var(--border-color); font-size:12px; border-radius: 4px;" />
      <button id="conpot-export" class="action-btn" style="padding:4px 8px; font-size:12px;">Export CSV</button>
    </div>
  </div>
  
  <div class="table-responsive">
    <table class="data-table dense-table" id="conpot-table">
      <thead>
        <tr>
          <th>Protocol</th>
          <th>Function Code</th>
          <th>Register</th>
          <th>Address</th>
          <th>Translation</th>
          <th>Severity</th>
          <th>Source IP</th>
          <th>Timestamp</th>
          <th>Investigation</th>
        </tr>
      </thead>
      <tbody id="conpot-tbody">
        <tr><td colspan="9" class="offline-msg">No SCADA telemetry available.</td></tr>
      </tbody>
    </table>
  </div>
</div>
