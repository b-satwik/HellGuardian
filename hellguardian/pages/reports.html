<!-- Reports View Module -->
<div class="detail-panel">
  <div class="panel-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; flex-wrap: wrap; gap: 10px;">
    <h3>Executive Campaign Summary Reports</h3>
    <div style="display:flex; gap:10px; align-items: center; flex-wrap: wrap;">
      <input type="text" id="reports-search" placeholder="Search reports..." style="padding:4px 8px; border:1px solid var(--border-color); font-size:12px; border-radius: 4px;" />
      <button id="reports-export" class="action-btn" style="padding:4px 8px; font-size:12px;">Export CSV</button>
      <button id="reports-generate-btn" class="action-btn" style="padding:4px 8px; font-size:12px;">Generate Again</button>
    </div>
  </div>
  
  <div class="cowrie-grid">
    <!-- Reports Explorer -->
    <div class="detail-panel">
      <h4>Platform Generated Threat Intelligence Briefings</h4>
      <div class="table-responsive" style="margin-top:10px;">
        <table class="data-table dense-table" id="reports-table">
          <thead>
            <tr>
              <th>Report Name</th>
              <th>Date</th>
              <th>Type</th>
              <th>Scope</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="reports-tbody">
            <tr><td colspan="5" class="offline-msg">No reports found.</td></tr>
          </tbody>
        </table>
      </div>
    </div>
    
    <!-- Dynamic Report Content -->
    <div class="detail-panel" id="reports-viewer" style="display:none;">
      <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border-color); padding-bottom:8px; margin-bottom:12px; flex-wrap: wrap; gap: 10px;">
        <h4 id="report-title-display">Threat Briefing Report</h4>
        <div>
          <button id="report-download-md" class="action-btn" style="padding:2px 6px; font-size:11px;">Download MD</button>
          <button id="report-download-pdf" class="action-btn" style="padding:2px 6px; font-size:11px;">Download PDF</button>
        </div>
      </div>
      <div id="report-content-body" style="font-size:12px; line-height:1.6; white-space:pre-wrap; max-height:400px; overflow-y:auto; padding:10px; background:#f5f5f7; border-radius:4px;"></div>
    </div>
  </div>
</div>
